[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sanat sahu", email = "sanat.sahu@polariscampus.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "boto3>=1.43.67",
    "celery>=5.6.3",
    "faiss-cpu>=1.15.0",
    "fastapi>=0.141.1",
    "google-cloud-storage>=3.4.1",
    "google-generativeai>=0.8.6",
    "greenlet>=3.5.4",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-google-genai>=4.3.2",
    "langgraph>=1.2.10",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.51",
    "svix>=1.99.1",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
